version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ticket-db-compose
    restart: always
    # Beolvassuk az .env fájlt az adatbázishoz is
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ticket-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    # A backend is megkapja az ÖSSZES változót az .env fájlból!
    env_file:
      - .env

volumes:
  postgres_data: